<!-- public/games/1to50-multi/index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1 to 50 멀티 배틀</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    :root {
      --bg-color: #090d16; --card-bg: #131b2e; --card-border: #1e293b; --text-main: #f8fafc;
      --text-sub: #94a3b8; --input-bg: #0b1120; --tile-bg: #1e293b; --tile-border: #334155;
      --tile-text: #ffffff; --tile-phase2-bg: #2563eb; --tile-phase2-border: #60a5fa;
      --accent: #facc15; --accent-text: #0f172a;
    }
    body.light {
      --bg-color: #f8fafc; --card-bg: #ffffff; --card-border: #e2e8f0; --text-main: #0f172a;
      --text-sub: #64748b; --input-bg: #f1f5f9; --tile-bg: #f8fafc; --tile-border: #cbd5e1;
      --tile-text: #0f172a; --tile-phase2-bg: #3b82f6; --tile-phase2-border: #2563eb;
      --accent: #eab308; --accent-text: #ffffff;
    }
    body, html { width: 100%; height: 100%; background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; transition: background-color 0.2s, color 0.2s; }
    #app { width: 100%; max-width: 680px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; position: relative; }
    .view { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; }
    .view.active { display: flex; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 440px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 900; text-align: center; color: var(--accent); }
    .subtitle { text-align: center; font-size: 13px; color: var(--text-sub); margin-top: 4px; }
    .input-group { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    input, select { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: var(--accent); }
    button { background: var(--accent); color: var(--accent-text); border: none; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    button:active { transform: scale(0.98); }
    button.secondary { background: var(--tile-bg); color: var(--text-main); border: 1px solid var(--card-border); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .form-item { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 800; color: var(--text-sub); }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 12px; }

    /* 대기실 방 코드 & 복사 버튼 분리 */
    .room-code-container { margin: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .room-code-badge {
      width: 100%; background: var(--input-bg); border: 2px dashed var(--accent);
      padding: 12px; border-radius: 14px; text-align: center; font-size: 24px;
      font-weight: 900; letter-spacing: 4px; color: var(--accent);
      display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.15s ease;
    }
    .room-code-text { cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: opacity 0.15s ease; }
    .room-code-text:hover { opacity: 0.7; }
    .btn-copy-code {
      position: absolute; right: 12px; background: var(--accent); color: var(--accent-text);
      border: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 800;
      cursor: pointer; letter-spacing: 0; white-space: nowrap; transition: transform 0.1s;
    }
    .btn-copy-code:active { transform: scale(0.95); }
    .room-code-hint { font-size: 11px; font-weight: 700; color: var(--text-sub); }

    .room-info-bar { display: flex; justify-content: space-around; background: var(--input-bg); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 8px; }
    .player-list { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 180px; }
    .player-item { background: var(--input-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; gap: 8px; }
    .btn-kick { background: #ef4444; color: #ffffff; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; flex-shrink: 0; }

    .game-top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .target-box { background: var(--accent); color: var(--accent-text); padding: 6px 18px; border-radius: 999px; font-size: 16px; font-weight: 900; }
    .timer-container { display: flex; align-items: baseline; gap: 4px; }
    .timer { font-size: 22px; font-weight: 900; font-family: monospace; color: #0284c7; }
    body:not(.light) .timer { color: #38bdf8; }
    .timer.warning { color: #ef4444 !important; animation: blink 0.5s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
    .timer-limit { font-size: 12px; font-weight: 700; color: var(--text-sub); }

    .grid-container { width: 100%; display: flex; justify-content: center; align-items: center; flex: 1; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; width: 100%; aspect-ratio: 1 / 1; transition: max-width 0.2s ease; }
    .grid.size-sm { max-width: 360px; gap: 6px; } .grid.size-sm .tile { font-size: 18px; border-radius: 8px; }
    .grid.size-md { max-width: 480px; gap: 8px; } .grid.size-md .tile { font-size: 24px; border-radius: 12px; }
    .grid.size-lg { max-width: 590px; gap: 10px; } .grid.size-lg .tile { font-size: 32px; border-radius: 14px; }

    .tile { width: 100%; height: 100%; background: var(--tile-bg); border: 1.5px solid var(--tile-border); color: var(--tile-text); font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.05s, background 0.12s; }
    .tile:active { transform: scale(0.92); }
    .tile.phase2 { background: var(--tile-phase2-bg); border-color: var(--tile-phase2-border); color: #ffffff; }
    body.no-highlight .tile.phase2 { background: var(--tile-bg) !important; border-color: var(--tile-border) !important; color: var(--tile-text) !important; }
    .tile.empty { visibility: hidden; pointer-events: none; opacity: 0; }

    #countdownOverlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; font-size: 90px; font-weight: 900; color: var(--accent); z-index: 50; }
    .rank-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    .rank-table th, .rank-table td { padding: 12px; text-align: center; border-bottom: 1px solid var(--card-border); font-size: 14px; font-weight: 700; }
    .rank-1 { color: var(--accent); font-size: 17px; font-weight: 900; }

    @media (max-width: 480px) {
      #app { padding: 6px; height: 100dvh; justify-content: flex-start; }
      .card { padding: 16px; border-radius: 16px; }
      h1 { font-size: 22px; }
      .input-group input, .input-group select, .input-group button { padding: 10px; font-size: 13px; }
      
      .room-code-badge { font-size: 20px; padding: 10px; }
      .btn-copy-code { padding: 6px 12px; font-size: 12px; right: 8px; }

      .player-item { padding: 8px 12px; font-size: 12px; }
      
      .game-top-bar { margin-bottom: 8px; margin-top: 10px; }
      .target-box { font-size: 14px; padding: 4px 12px; }
      .timer { font-size: 18px; }
      .timer-limit { font-size: 10px; }
      
      .grid-container { align-items: flex-start; }
      .grid.size-sm { gap: 4px; max-width: 320px; }
      .grid.size-sm .tile { font-size: 16px; border-radius: 6px; }
      .grid.size-md { gap: 6px; max-width: 400px; }
      .grid.size-md .tile { font-size: 20px; border-radius: 8px; }
      .grid.size-lg { gap: 8px; max-width: 460px; }
      .grid.size-lg .tile { font-size: 24px; border-radius: 10px; }
      
      .rank-table th, .rank-table td { padding: 8px; font-size: 12px; }
      .rank-1 { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="countdownOverlay">3</div>
  <div id="viewMenu" class="view active">
    <div class="card">
      <h1>⚡ 1 TO 50 멀티</h1>
      <p class="subtitle">80초 안에 1부터 50까지 실시간 순발력 대결!</p>
      <div class="input-group">
        <input type="text" id="nicknameInput" placeholder="닉네임 입력 (미입력 시 랜덤 생성)" maxlength="16" />
        <button id="btnOpenCreateModal">방 만들기 (설정)</button>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="joinCodeInput" placeholder="방 코드 4자리" maxlength="4" style="flex: 1; text-transform: uppercase;" />
          <button id="btnJoinRoom" class="secondary" style="flex: 1;">입장하기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="createRoomModal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="font-size: 20px; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 16px;">⚙️ 방 설정하기</h2>
      <div class="form-item"><label class="form-label">최대 참가 인원</label><select id="modalMaxPlayers"><option value="2">2명</option><option value="4">4명</option><option value="8" selected>8명 (권장)</option><option value="16">16명</option><option value="32">32명</option></select></div>
      <div class="form-item"><label class="form-label">닉네임 설정 규칙</label><div class="toggle-row"><span style="font-size: 13px; font-weight: 700;">사용자 직접 입력 허용</span><input type="checkbox" id="modalAllowCustomNick" checked style="width: 18px; height: 18px; cursor: pointer;" /></div></div>
      <div class="form-item"><label class="form-label">닉네임 금지 단어 (쉼표 구분)</label><input type="text" id="modalBannedWords" placeholder="예: 바보, 멍청이, 비속어" /></div>
      <div style="display: flex; gap: 8px; margin-top: 20px;"><button id="btnCancelModal" class="secondary" style="flex: 1;">취소</button><button id="btnConfirmCreateRoom" style="flex: 2;">방 만들기 시작</button></div>
    </div>
  </div>

  <div id="viewLobby" class="view">
    <div class="card">
      <h2 style="text-align: center; font-size: 20px;">대기실</h2>
      <p class="subtitle">방 코드를 공개한 뒤 복사하여 공유하세요! (제한시간 80초)</p>
      
      <!-- 방 코드 & 복사 영역 -->
      <div class="room-code-container">
        <div id="roomCodeDisplay" class="room-code-badge"></div>
        <span id="roomCodeHint" class="room-code-hint">클릭하여 방 코드 확인</span>
      </div>

      <div class="room-info-bar"><span>정원: <span id="infoMaxPlayers">8</span>명</span><span>닉네임: <span id="infoNickRule">자유</span></span><span>금지어: <span id="infoBannedCount">0</span>개</span></div>
      <div style="font-size: 13px; font-weight: 700; color: var(--text-sub); margin-top: 4px;">참가자 (<span id="playerCount">1</span>/<span id="maxCountDisplay">8</span>명)</div>
      <ul id="playerList" class="player-list"></ul>
      <button id="btnStartGame" style="margin-top: 14px; display: none;">대결 시작!</button>
      <div id="waitingHostText" style="text-align: center; font-size: 13px; color: var(--text-sub); padding: 14px; display: none;">방장이 대결을 시작할 때까지 대기 중...</div>
    </div>
  </div>

  <div id="viewGame" class="view">
    <div class="game-top-bar"><div class="target-box">NEXT: <span id="targetNum">1</span></div><div class="timer-container"><div class="timer" id="gameTimer">00.00</div><span class="timer-limit">/ 80.00s</span></div></div>
    <div class="grid-container"><div class="grid size-md" id="tileGrid"></div></div>
  </div>

  <div id="viewResult" class="view">
    <div class="card" style="text-align: center;">
      <h1>🏆 최종 결과</h1>
      <p class="subtitle">가장 빠른 순서로 정렬된 최종 순위표</p>
      <table class="rank-table"><thead><tr style="color: var(--text-sub);"><th>순위</th><th>닉네임</th><th>기록</th></tr></thead><tbody id="rankTableBody"></tbody></table>
      <button id="btnBackToLobby" style="margin-top: 18px; width: 100%;">대기실로 돌아가기</button>
    </div>
  </div>
</div>

<script>
const TIME_LIMIT = 80.0;
let audioCtx = null;
function playSound(freq, duration = 0.05, type = 'sine') {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function generateRandomNickname() {
  const adjs = ['행복한', '빠른', '느긋한', '똑똑한', '멋진', '조용한', '날렵한', '심심한', '달콤한'];
  const nouns = ['사과', '고양이', '강아지', '바나나', '호랑이', '토끼', '딸기', '수박', '포도'];
  return `${adjs[Math.floor(Math.random() * adjs.length)]}${nouns[Math.floor(Math.random() * nouns.length)]}${Math.floor(1000 + Math.random() * 9000)}`;
}

let peer = null; let connections = []; let hostConn = null; let isHost = false; let myId = ''; let myNickname = ''; let roomCode = ''; let isRoomCodeRevealed = false;
let roomSettings = { maxPlayers: 8, allowCustomNickname: true, bannedWords: [] };
let players = {}; let currentTarget = 1; let boardState = []; let pool26to50 = []; let timerInterval = null; let startTime = 0; let isGameOver = false;

const views = { menu: document.getElementById('viewMenu'), lobby: document.getElementById('viewLobby'), game: document.getElementById('viewGame'), result: document.getElementById('viewResult') };
function showView(name) { Object.keys(views).forEach(k => views[k].classList.remove('active')); views[name].classList.add('active'); }

function syncLeaderboardToParent() { if (window.parent) { window.parent.postMessage({ type: 'MEONGTIME_LEADERBOARD', players: players, myId: myId }, '*'); } }
window.addEventListener('message', (event) => {
  if (event.data?.type === 'MEONGTIME_SET_TILE_SIZE') { const grid = document.getElementById('tileGrid'); if (grid) { grid.className = `grid size-${event.data.size}`; } }
  else if (event.data?.type === 'MEONGTIME_SET_THEME') { document.body.classList.toggle('light', event.data.theme === 'light'); }
  else if (event.data?.type === 'MEONGTIME_SET_HIGHLIGHT') { document.body.classList.toggle('no-highlight', !event.data.enabled); }
});

function getShuffledArray(min, max) {
  const arr = []; for (let i = min; i <= max; i++) arr.push(i);
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr;
}

const modalEl = document.getElementById('createRoomModal');
document.getElementById('btnOpenCreateModal').addEventListener('click', () => modalEl.classList.add('active'));
document.getElementById('btnCancelModal').addEventListener('click', () => modalEl.classList.remove('active'));

document.getElementById('btnConfirmCreateRoom').addEventListener('click', () => {
  modalEl.classList.remove('active'); const inputVal = document.getElementById('nicknameInput').value.trim();
  roomSettings = { maxPlayers: parseInt(document.getElementById('modalMaxPlayers').value, 10), allowCustomNickname: document.getElementById('modalAllowCustomNick').checked, bannedWords: document.getElementById('modalBannedWords').value.split(',').map(w => w.trim()).filter(Boolean) };
  myNickname = (!roomSettings.allowCustomNickname || !inputVal) ? generateRandomNickname() : inputVal;
  isHost = true; roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
  peer = new Peer(`meongtime-1to50-${roomCode}`);
  peer.on('open', (id) => { myId = id; players[myId] = { nickname: myNickname, progress: 0, time: null, finished: false, timedOut: false }; setupLobbyUI(); syncLeaderboardToParent(); });
  peer.on('connection', (conn) => { connections.push(conn); conn.on('data', (data) => handleHostReceiveData(conn, data)); conn.on('close', () => { delete players[conn.peer]; connections = connections.filter(c => c !== conn); broadcast({ type: 'PLAYER_LIST', players }); renderLobbyList(); syncLeaderboardToParent(); }); });
});

document.getElementById('btnJoinRoom').addEventListener('click', () => {
  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase(); if (code.length !== 4) return alert('4자리 방 코드를 입력하세요.');
  myNickname = document.getElementById('nicknameInput').value.trim(); isHost = false; roomCode = code;
  peer = new Peer();
  peer.on('open', (id) => {
    myId = id; hostConn = peer.connect(`meongtime-1to50-${roomCode}`);
    hostConn.on('open', () => hostConn.send({ type: 'JOIN', nickname: myNickname }));
    hostConn.on('data', (data) => handleGuestReceiveData(data));
    hostConn.on('error', () => alert('방을 찾을 수 없거나 연결에 실패했습니다.'));
  });
});

/* ==========================================================
   💡 방 코드 클릭/복사 분리 로직 (1to50 멀티)
   ========================================================== */
window.toggleRoomCode = function(e) {
  if (e) e.stopPropagation();
  isRoomCodeRevealed = !isRoomCodeRevealed;
  renderRoomCodeBadge();
};

window.copyRoomCode = function(e) {
  if (e) e.stopPropagation();
  navigator.clipboard.writeText(roomCode);
  alert(`방 코드 [${roomCode}]가 복사되었습니다!`);
};

function renderRoomCodeBadge() {
  const badge = document.getElementById('roomCodeDisplay');
  const hintEl = document.getElementById('roomCodeHint');

  if (!isRoomCodeRevealed) {
    badge.innerHTML = `
      <div class="room-code-text" onclick="toggleRoomCode(event)">
        <span>🔒</span><span>• • • •</span>
      </div>
    `;
    if (hintEl) hintEl.textContent = '클릭하여 방 코드 확인';
  } else {
    badge.innerHTML = `
      <div class="room-code-text" onclick="toggleRoomCode(event)">
        <span>🔓</span><span>${roomCode}</span>
      </div>
      <button class="btn-copy-code" onclick="copyRoomCode(event)">복사</button>
    `;
    if (hintEl) hintEl.textContent = '우측 버튼을 눌러 복사 (코드 클릭 시 숨김)';
  }
}

function setupLobbyUI() {
  showView('lobby'); isRoomCodeRevealed = false; renderRoomCodeBadge();
  document.getElementById('infoMaxPlayers').textContent = roomSettings.maxPlayers; document.getElementById('maxCountDisplay').textContent = roomSettings.maxPlayers; document.getElementById('infoNickRule').textContent = roomSettings.allowCustomNickname ? '자유' : '랜덤강제'; document.getElementById('infoBannedCount').textContent = roomSettings.bannedWords.length;
  if (isHost) { document.getElementById('btnStartGame').style.display = 'block'; document.getElementById('waitingHostText').style.display = 'none'; } else { document.getElementById('btnStartGame').style.display = 'none'; document.getElementById('waitingHostText').style.display = 'block'; }
  renderLobbyList();
}

function kickUser(targetPeerId) {
  if (!isHost || targetPeerId === myId) return;
  const targetConn = connections.find(c => c.peer === targetPeerId);
  if (targetConn) { targetConn.send({ type: 'KICK', reason: '방장에 의해 방에서 강퇴당했습니다.' }); setTimeout(() => targetConn.close(), 100); }
  delete players[targetPeerId]; connections = connections.filter(c => c.peer !== targetPeerId);
  broadcast({ type: 'PLAYER_LIST', players }); renderLobbyList(); syncLeaderboardToParent();
}

function renderLobbyList() {
  const listEl = document.getElementById('playerList'); listEl.innerHTML = '';
  document.getElementById('playerCount').textContent = Object.keys(players).length;
  Object.keys(players).forEach((pid) => {
    const isMe = pid === myId; const li = document.createElement('li'); li.className = 'player-item';
    let rightHtml = `<span style="color:var(--accent); font-weight:800;">대기 중</span>`;
    if (isHost && !isMe) { rightHtml = `<div style="display:flex; align-items:center; gap:6px;"><span style="color:var(--accent); font-weight:800; font-size:12px;">대기 중</span><button class="btn-kick" onclick="kickUser('${pid}')">강퇴</button></div>`; }
    li.innerHTML = `<span>${players[pid].nickname} ${isMe ? '(나)' : ''}</span>${rightHtml}`; listEl.appendChild(li);
  });
}

function handleHostReceiveData(conn, data) {
  if (data.type === 'JOIN') {
    if (Object.keys(players).length >= roomSettings.maxPlayers) { conn.send({ type: 'JOIN_REJECT', reason: '방이 꽉 찼습니다.' }); setTimeout(() => conn.close(), 300); return; }
    let guestNick = (data.nickname || '').trim(); if (!roomSettings.allowCustomNickname || !guestNick) guestNick = generateRandomNickname();
    if (roomSettings.bannedWords.some(bw => guestNick.includes(bw))) { conn.send({ type: 'JOIN_REJECT', reason: '금지 단어 포함' }); setTimeout(() => conn.close(), 300); return; }
    players[conn.peer] = { nickname: guestNick, progress: 0, time: null, finished: false, timedOut: false };
    conn.send({ type: 'JOIN_SUCCESS', myAssignedNick: guestNick, settings: roomSettings }); broadcast({ type: 'PLAYER_LIST', players }); renderLobbyList(); syncLeaderboardToParent();
  } else if (data.type === 'PROGRESS') { if (players[conn.peer]) { players[conn.peer].progress = data.progress; broadcast({ type: 'PROGRESS_UPDATE', players }); syncLeaderboardToParent(); }
  } else if (data.type === 'FINISH') { if (players[conn.peer]) { players[conn.peer].finished = true; players[conn.peer].time = data.time; players[conn.peer].timedOut = !!data.timedOut; players[conn.peer].progress = data.progress; broadcast({ type: 'FINISH_UPDATE', players }); syncLeaderboardToParent(); checkAllFinished(); } }
}

function handleGuestReceiveData(data) {
  if (data.type === 'KICK') { alert(data.reason); if (hostConn) hostConn.close(); showView('menu');
  } else if (data.type === 'JOIN_REJECT') { alert(data.reason); showView('menu');
  } else if (data.type === 'JOIN_SUCCESS') { myNickname = data.myAssignedNick; roomSettings = data.settings; setupLobbyUI();
  } else if (data.type === 'PLAYER_LIST') { players = data.players; renderLobbyList(); syncLeaderboardToParent();
  } else if (data.type === 'START') { startGame(data.map1to25, data.map26to50);
  } else if (data.type === 'PROGRESS_UPDATE' || data.type === 'FINISH_UPDATE') { players = data.players; syncLeaderboardToParent(); checkAllFinished(); }
}

function broadcast(data) { connections.forEach(conn => conn.send(data)); }

document.getElementById('btnStartGame').addEventListener('click', () => {
  const map1 = getShuffledArray(1, 25); const map2 = getShuffledArray(26, 50); broadcast({ type: 'START', map1to25: map1, map26to50: map2 }); startGame(map1, map2);
});

function startGame(map1, map2) {
  boardState = [...map1]; pool26to50 = [...map2]; currentTarget = 1; isGameOver = false; document.getElementById('targetNum').textContent = 1;
  const timerEl = document.getElementById('gameTimer'); timerEl.className = 'timer'; timerEl.textContent = '00.00';
  Object.keys(players).forEach(pid => { players[pid].progress = 0; players[pid].time = null; players[pid].finished = false; players[pid].timedOut = false; });
  showView('game'); renderBoard(); syncLeaderboardToParent();
  const overlay = document.getElementById('countdownOverlay'); overlay.style.display = 'flex'; let count = 3; overlay.textContent = count; playSound(440, 0.1);
  const cdTimer = setInterval(() => { count--; if (count > 0) { overlay.textContent = count; playSound(440, 0.1); } else if (count === 0) { overlay.textContent = 'START!'; playSound(880, 0.2); } else { clearInterval(cdTimer); overlay.style.display = 'none'; startTimer(); } }, 1000);
}

function startTimer() {
  startTime = performance.now(); const timerEl = document.getElementById('gameTimer');
  timerInterval = setInterval(() => { const elapsed = (performance.now() - startTime) / 1000; if (elapsed >= TIME_LIMIT) { handleTimeout(); } else { timerEl.textContent = elapsed.toFixed(2); if (elapsed >= 70) timerEl.classList.add('warning'); } }, 30);
}

function handleTimeout() {
  clearInterval(timerInterval); isGameOver = true; document.getElementById('gameTimer').textContent = '80.00'; playSound(150, 0.4, 'sawtooth');
  players[myId].finished = true; players[myId].timedOut = true; players[myId].time = TIME_LIMIT;
  if (isHost) { broadcast({ type: 'FINISH_UPDATE', players }); syncLeaderboardToParent(); checkAllFinished(); } else { hostConn.send({ type: 'FINISH', time: TIME_LIMIT, timedOut: true, progress: players[myId].progress }); }
}

function renderBoard() {
  const grid = document.getElementById('tileGrid'); grid.innerHTML = '';
  boardState.forEach((num, index) => {
    const tile = document.createElement('div'); tile.className = `tile ${num > 25 ? 'phase2' : ''} ${num === null ? 'empty' : ''}`; tile.textContent = num || '';
    tile.onclick = () => handleTileClick(index); grid.appendChild(tile);
  });
}

function handleTileClick(index) {
  if (isGameOver || players[myId]?.finished) return;
  const val = boardState[index];
  if (val === currentTarget) {
    playSound(400 + currentTarget * 15, 0.04);
    boardState[index] = pool26to50.length > 0 ? pool26to50.shift() : null;
    currentTarget++; document.getElementById('targetNum').textContent = Math.min(currentTarget, 50); renderBoard();
    players[myId].progress = currentTarget - 1;
    if (isHost) { broadcast({ type: 'PROGRESS_UPDATE', players }); syncLeaderboardToParent(); } else { hostConn.send({ type: 'PROGRESS', progress: currentTarget - 1 }); }
    if (currentTarget > 50) {
      clearInterval(timerInterval); isGameOver = true; const finishTime = parseFloat(((performance.now() - startTime) / 1000).toFixed(2)); playSound(1200, 0.3, 'triangle');
      players[myId].finished = true; players[myId].timedOut = false; players[myId].time = finishTime;
      if (isHost) { broadcast({ type: 'FINISH_UPDATE', players }); syncLeaderboardToParent(); checkAllFinished(); } else { hostConn.send({ type: 'FINISH', time: finishTime, timedOut: false, progress: 50 }); }
    }
  } else if (val !== null) { playSound(180, 0.08, 'sawtooth'); }
}

function checkAllFinished() { if (Object.keys(players).every(k => players[k].finished)) setTimeout(() => { showView('result'); const tbody = document.getElementById('rankTableBody'); tbody.innerHTML = ''; Object.values(players).sort((a, b) => { const aOk = a.finished && !a.timedOut; const bOk = b.finished && !b.timedOut; if (aOk && bOk) return a.time - b.time; if (aOk) return -1; if (bOk) return 1; return b.progress - a.progress; }).forEach((p, i) => { const tr = document.createElement('tr'); const isOk = p.finished && !p.timedOut; tr.innerHTML = `<td class="${i===0&&isOk?'rank-1':''}">${i===0&&isOk?'🥇 1등':i+1+'등'}</td><td style="font-weight:800;">${p.nickname}</td><td>${isOk?`<span style="color:#0284c7;font-weight:800;">${p.time}초</span>`:`<span style="color:#ef4444;font-weight:800;">시간초과 (${p.progress}/50)</span>`}</td>`; tbody.appendChild(tr); }); }, 800); }

document.getElementById('btnBackToLobby').addEventListener('click', () => setupLobbyUI());
</script>
</body>
